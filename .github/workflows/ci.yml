name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  rules-core:
    name: Rules core (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/qc_core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test bin
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Balance simulator smoke run
        run: dart run bin/simulate.dart --raids 300

  qiskit:
    name: Reference vectors match Qiskit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install qiskit
      - run: python packages/qc_core/test/qiskit_check.py

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/web

  android:
    name: Android release APK
    runs-on: ubuntu-latest
    needs: app
    defaults:
      run:
        working-directory: app
    env:
      # Optional repository secrets for a store-ready signature. Without them
      # the release APK is signed with the debug key (fine for sideloading).
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up release signing
        id: signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "suffix=signed" >> "$GITHUB_OUTPUT"
            echo "Signing with the upload key from repository secrets."
          else
            echo "suffix=debug-signed" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the release APK is signed with the debug key."
          fi
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Name the APK
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          name="quantum-corsairs-${version}-${{ github.run_number }}-${{ steps.signing.outputs.suffix }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$name"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: app/build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 14 }}
      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
